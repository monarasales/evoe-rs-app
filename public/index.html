<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evoé Gestão e RH — Recrutamento e Seleção</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="login-screen" class="login-screen hidden">
      <form id="login-form" class="login-card">
        <div class="login-logo-wrap">
          <img id="login-logo" class="login-logo-img" src="/img/logo-evoe.svg" alt="Evoé Gestão e RH"
               onload="this.classList.add('carregada'); document.getElementById('login-brand-texto').classList.add('escondida');"
               onerror="this.remove();" />
          <div class="login-brand" id="login-brand-texto">EVOÉ GESTÃO E RH</div>
        </div>
        <h1>Recrutamento &amp; Seleção</h1>
        <p class="login-sub">Entre com seu usuário para acessar o funil de vagas.</p>
        <label>Usuário
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>Senha
          <input type="password" id="login-senha" autocomplete="current-password" required />
        </label>
        <div id="login-erro" class="form-erro hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p class="login-hint">Usuários de teste: mariana / rafael / camila — senha: evoe123</p>
      </form>
    </div>

    <div id="main-screen" class="app-shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img id="sidebar-logo" class="sidebar-logo-img" src="/img/logo-evoe-topbar.svg" alt="Evoé Gestão e RH"
               onload="this.classList.add('carregada'); document.getElementById('sidebar-brand-texto').classList.add('escondida');"
               onerror="this.remove();" />
          <span id="sidebar-brand-texto"><span class="brand-evoe">EVOÉ</span> <span class="brand-sub">Gestão e RH</span></span>
        </div>

        <nav id="main-nav" class="sidebar-nav"></nav>

        <div class="sidebar-footer">
          <button id="btn-ponto-widget" class="sidebar-notif-btn hidden" title="Clique para bater o ponto">
            <span class="sidebar-notif-icon">🕒</span>
            <span id="ponto-widget-texto">Ponto</span>
          </button>
          <button id="btn-notificacoes" class="sidebar-notif-btn" title="Notificações">
            <span class="sidebar-notif-icon">🔔<span id="notif-badge" class="badge hidden">0</span></span>
            <span>Notificações</span>
          </button>
          <div class="user-chip">
            <div class="user-chip-info">
              <span id="user-nome"></span>
              <span id="user-perfil" class="perfil-tag"></span>
            </div>
            <button id="btn-logout" class="icon-btn-ghost" title="Sair">⏻</button>
          </div>
        </div>
      </aside>

      <div class="main-area">
        <main id="view-root" class="view-root"></main>
      </div>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
