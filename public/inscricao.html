<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vagas — Evoé Gestão e RH</title>
  <meta name="description" content="Vagas abertas da Evoé Gestão e RH. Inscreva-se enviando seu currículo." />
  <style>
    :root {
      --navy: #122454; --navy-dark: #0b1638; --teal: #22c3b6; --purple: #7c5cfa;
      --gradiente: linear-gradient(135deg, #22c3b6 0%, #7c5cfa 100%);
      --bg: #f3f5f9; --borda: #e3e7ec; --texto: #1f2937; --suave: #6b7683;
      --erro: #c0392b; --erro-bg: #fdecea; --ok: #1e7e45; --ok-bg: #e8f8ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--texto); -webkit-font-smoothing: antialiased; }
    header { background: var(--navy-dark); padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; text-align: center; }
    header img { max-height: 46px; max-width: 70%; }
    header .marca { color: var(--teal); font-weight: 700; letter-spacing: 1px; }
    main { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { color: var(--navy); font-size: 24px; margin: 4px 0 6px; letter-spacing: -.3px; }
    h2 { color: var(--navy); font-size: 17px; margin: 22px 0 10px; }
    .empresa { color: var(--suave); font-size: 14px; margin-bottom: 14px; }
    .cartao { background: white; border: 1px solid var(--borda); border-radius: 14px; padding: 20px; box-shadow: 0 4px 14px rgba(16,30,44,.06); margin-bottom: 16px; }
    .descricao { white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    label .opc { font-weight: 400; color: var(--suave); }
    input[type=text], input[type=email], input[type=tel], textarea {
      width: 100%; padding: 12px 13px; border: 1px solid var(--borda); border-radius: 10px; font-size: 16px; font-family: inherit; background: white;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--teal); }
    textarea { min-height: 90px; resize: vertical; }
    .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .arquivo { border: 2px dashed var(--borda); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; background: #fafbfc; }
    .arquivo.tem { border-color: var(--teal); background: #e3f8f6; }
    .arquivo input { display: none; }
    .dica { font-size: 13px; color: var(--suave); margin-top: 6px; }
    .termo { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; font-weight: 400; line-height: 1.5; margin-top: 18px; }
    .termo input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
    .botao { display: block; width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 12px; background: var(--gradiente); color: white; font-size: 17px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
    .botao:disabled { opacity: .6; }
    .erro { background: var(--erro-bg); color: var(--erro); padding: 12px; border-radius: 10px; margin-top: 14px; font-size: 14px; }
    .sucesso { text-align: center; padding: 30px 20px; }
    .sucesso .icone { font-size: 52px; }
    .vaga-item { display: block; text-decoration: none; color: inherit; }
    .vaga-item h3 { margin: 0 0 4px; color: var(--navy); font-size: 17px; }
    .vaga-item .ver { color: var(--teal); font-weight: 600; font-size: 14px; margin-top: 8px; }
    .armadilha { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .vazio { text-align: center; color: var(--suave); padding: 30px 10px; }
    footer { text-align: center; color: var(--suave); font-size: 12.5px; padding: 0 16px 30px; }
    .hidden { display: none !important; }
    /* ----- Página da vaga ----- */
    .hero { background: radial-gradient(circle at 80% 0%, #24366e 0%, var(--navy-dark) 55%, #070f29 100%); color: white; padding: calc(22px + env(safe-area-inset-top, 0px)) 16px 70px; }
    .hero-dentro { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }
    .hero-topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
    .hero-topo img { height: 36px; }
    .selo { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 20px; padding: 5px 12px; font-size: 13px; color: #dfe6f3; }
    .hero h1 { color: white; font-size: 40px; line-height: 1.1; margin: 0 0 14px; letter-spacing: -.8px; }
    .hero-resumo { color: #c3cce0; font-size: 16.5px; line-height: 1.55; margin: 0 0 22px; max-width: 620px; }
    .hero-botoes { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-botoes .botao { width: auto; margin: 0; padding: 14px 22px; font-size: 15.5px; }
    .hero-botoes .botao.secundario { background: rgba(255,255,255,.12); color: white; border: 1px solid rgba(255,255,255,.2); }
    .rapida { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 18px; }
    .rapida-titulo { font-size: 11.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #9fb0d1; margin-bottom: 10px; }
    .rapida-item { display: flex; gap: 12px; align-items: center; padding: 8px 0; }
    .rapida-icone { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 17px; flex: none; }
    .rapida-rotulo { font-size: 12px; color: #9fb0d1; }
    .rapida-valor { font-weight: 700; font-size: 14.5px; }
    main.com-hero { max-width: 860px; margin-top: -40px; position: relative; }
    .secao h2 { margin: 0; font-size: 20px; }
    .secao-sub { color: var(--suave); font-size: 13.5px; margin: 2px 0 14px; }
    .secao h3 { font-size: 15px; color: var(--navy); margin: 16px 0 8px; }
    .texto { white-space: pre-wrap; line-height: 1.65; margin: 0; font-size: 15px; }
    .mini { color: var(--suave); font-size: 13.5px; }
    .objetivos { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .objetivos li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.5; }
    .num { width: 28px; height: 28px; border-radius: 50%; background: var(--gradiente); color: white; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; flex: none; }
    .resp { list-style: none; padding: 0; margin: 0; }
    .resp li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid #f1f3f6; line-height: 1.45; }
    .resp li:last-child { border-bottom: none; }
    .freq { font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; background: #eef1f5; color: var(--suave); flex: none; }
    .freq-diária { background: #e3f8f6; color: #128a80; } .freq-semanal { background: #f1ecff; color: #5b3fd6; } .freq-mensal { background: #fff4e5; color: #a8650a; }
    .check { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .check li { position: relative; padding-left: 28px; line-height: 1.5; }
    .check li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .check.desejavel li::before { content: "+"; background: #f1ecff; color: var(--purple); }
    .duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .duas-col .cartao { margin-bottom: 16px; }
    .destaque { font-size: 22px; font-weight: 800; color: var(--navy); }
    .beneficios { display: flex; flex-wrap: wrap; gap: 8px; }
    .beneficios span { background: var(--bg); border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 600; color: var(--navy); }
    .vaga-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .vaga-tags span { background: var(--bg); border-radius: 14px; padding: 3px 10px; font-size: 12.5px; color: var(--suave); }
    /* ----- Pesquisa NPS ----- */
    .criterio { padding: 12px 0; border-top: 1px solid #f1f3f6; }
    .criterio:first-of-type { border-top: none; padding-top: 0; }
    .criterio-nome { font-weight: 700; font-size: 15.5px; color: var(--navy); }
    .estrelas { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .estrela { background: none; border: none; font-size: 34px; line-height: 1; color: #d6dae1; cursor: pointer; padding: 2px; }
    .estrela.on { color: #f5a623; }
    .estrela-rotulo { margin-left: 8px; font-size: 13.5px; color: var(--suave); font-weight: 600; }
    .nps-escala { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
    .nps-nota { height: 46px; border-radius: 10px; border: 2px solid var(--borda); background: white; font-size: 16px; font-weight: 700; cursor: pointer; color: var(--texto); padding: 0; }
    .nps-nota.on.nps-baixo { background: #d03b3b; border-color: #d03b3b; color: white; }
    .nps-nota.on.nps-medio { background: #8a8f98; border-color: #8a8f98; color: white; }
    .nps-nota.on.nps-alto { background: #0ca30c; border-color: #0ca30c; color: white; }
    .nps-legenda { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--suave); margin-top: 6px; }
    @media (max-width: 420px) { .nps-escala { grid-template-columns: repeat(6, 1fr); } .estrela { font-size: 38px; } }
    /* ----- Lista de vagas ----- */
    .hero-dentro-lista { display: block; max-width: 980px; }
    .hero-lista { padding-bottom: 80px; }
    .busca { display: flex; align-items: center; gap: 10px; background: white; border-radius: 14px; padding: 6px 8px 6px 16px; max-width: 640px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .busca input { border: none; padding: 12px 4px; font-size: 16px; width: 100%; background: transparent; }
    .busca input:focus { outline: none; }
    main.com-hero-lista { max-width: 980px; }
    .filtros { display: grid; gap: 10px; padding: 14px 18px; }
    .filtro-grupo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filtro-rotulo { font-size: 12px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; min-width: 96px; }
    .filtro { border: 1px solid var(--borda); background: white; border-radius: 20px; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--texto); }
    .filtro.ativo { background: var(--navy); border-color: var(--navy); color: white; }
    .filtro-rodape { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: var(--suave); }
    .link { background: none; border: none; color: var(--purple); font-weight: 600; cursor: pointer; font-size: 13.5px; }
    .grade-vagas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 16px; }
    .grade-vagas .cartao { margin-bottom: 0; }
    .vaga-card-pub { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; transition: transform .12s, box-shadow .12s; }
    .vaga-card-pub:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(16,30,44,.12); }
    .vaga-card-pub h3 { margin: 0; color: var(--navy); font-size: 18px; line-height: 1.25; }
    .vaga-card-topo { display: flex; gap: 8px; align-items: center; }
    .selo-nova { background: var(--gradiente); color: white; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .resumo { margin: 0; line-height: 1.5; }
    .vaga-card-rodape { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid #f1f3f6; }
    .salario { color: var(--navy); font-size: 14px; }
    .vaga-card-pub .ver { color: var(--teal); font-weight: 700; font-size: 14px; }
    .processo h2, .cta-talentos h2 { margin: 4px 0 12px; }
    .passos { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .passos li { display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.4; }
    .cta-talentos { display: flex; gap: 18px; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #e3f8f6, #f1ecff); border: none; }
    .cta-talentos .botao { width: auto; margin: 0; white-space: nowrap; padding: 14px 20px; }
    @media (max-width: 820px) {
      .grade-vagas { grid-template-columns: 1fr; }
      .passos { grid-template-columns: 1fr; }
      .passos li { flex-direction: row; align-items: flex-start; }
      .cta-talentos { flex-direction: column; align-items: stretch; text-align: center; }
      .filtro-rotulo { min-width: 100%; }
    }
    @media (max-width: 820px) {
      .hero-dentro { grid-template-columns: 1fr; gap: 20px; }
      .hero h1 { font-size: 30px; }
      .duas-col { grid-template-columns: 1fr; gap: 0; }
      .hero-botoes .botao { flex: 1; text-align: center; }
    }
    .etapa { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--purple); }
    .proxima { background: #f1ecff; border-radius: 12px; padding: 14px 16px; margin: 18px 0 4px; text-align: left; }
    .como { background: var(--bg); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; font-size: 14.5px; line-height: 1.5; }
    .tag-mais, .tag-menos { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 6px; letter-spacing: .3px; }
    .tag-mais { background: var(--ok-bg); color: var(--ok); }
    .tag-menos { background: var(--erro-bg); color: var(--erro); }
    .progresso { height: 8px; background: #e3e7ec; border-radius: 6px; overflow: hidden; }
    .progresso-barra { height: 100%; background: var(--gradiente); transition: width .3s; }
    .disc-cabeca, .disc-linha { display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; align-items: center; }
    .disc-cabeca { margin-bottom: 6px; text-align: center; }
    .disc-linha { padding: 8px 0; border-top: 1px solid #f1f3f6; }
    .disc-palavra { font-size: 17px; font-weight: 600; }
    .disc-btn { height: 52px; border-radius: 12px; border: 2px solid var(--borda); background: white; font-size: 22px; cursor: pointer; filter: grayscale(1); opacity: .55; }
    .disc-btn.mais.on { border-color: var(--ok); background: var(--ok-bg); filter: none; opacity: 1; }
    .disc-btn.menos.on { border-color: var(--erro); background: var(--erro-bg); filter: none; opacity: 1; }
    .disc-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    .disc-nav .botao { margin-top: 0; }
    .botao.secundario { background: white; color: var(--navy); border: 1px solid var(--borda); }
    @media (max-width: 520px) { .linha { grid-template-columns: 1fr; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <header>
    <img src="/img/logo-evoe-topbar.svg" alt="Evoé Gestão e RH" onerror="this.outerHTML='<span class=marca>EVOÉ GESTÃO E RH</span>'" />
  </header>
  <main id="conteudo"><div class="vazio">Carregando...</div></main>
  <footer>Evoé Gestão e RH · Recrutamento e Seleção</footer>
  <script src="/js/inscricao.js"></script>
</body>
</html>
